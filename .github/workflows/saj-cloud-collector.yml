name: 24/7 SAJ Cloud Read-Only Solar Collector

on:
  schedule:
    # Runs automatically every 15 minutes, 24 hours a day, 7 days a week (0 Baht cost)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Number of historical days to backfill (e.g., 30, 90, 365)'
        required: false
        default: '30'

jobs:
  collect-saj-solar-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Read-Only SAJ Cloud Sync & Historical Log to Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAJ_GUEST_EMAIL: ${{ secrets.SAJ_GUEST_EMAIL }}
          SAJ_GUEST_PASSWORD: ${{ secrets.SAJ_GUEST_PASSWORD }}
          SAJ_DEVICE_SN: ${{ secrets.SAJ_DEVICE_SN }}
          SAJ_ORG_ID: ${{ secrets.SAJ_ORG_ID }}
        run: node scripts/saj-cloud-collector.mjs
